<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}My Blog{% endblock %}</title>
</head>

<body>
    <h1>My Django Blog</h1>

    <div>
        {% if user.is_authenticated %}
        <a href="{% url 'logout' %}">Logout</a>
        {% else %}
        <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </div>

    <hr>

    {% if messages %}
    {% for message in messages}
    <div class="message {{ message.tags }}">
        <p>{{ message }}</p>
    </div>
    {% endfor %}
    {% endif %}

    {% block content %}

    {% endblock %}
</body>

</html>
