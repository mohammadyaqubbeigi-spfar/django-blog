<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}My Blog{% endblock %}</title>
    </head>

    <body>
        <h1>My Django Blog</h1>

        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </div>

        <hr>
        {% block content %}

        {% endblock %}
    </body>
</html>
